name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check src tests
      - run: uv run pytest
      - run: uv run pretext example -o /tmp/persona.yaml && uv run pretext validate /tmp/persona.yaml
      - run: uv run pretext generate /tmp/persona.yaml --api-key x --dry-run > /dev/null
