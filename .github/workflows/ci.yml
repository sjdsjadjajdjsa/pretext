name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check src tests
      - run: pytest
      - run: pretext example -o /tmp/persona.yaml && pretext validate /tmp/persona.yaml
      - run: pretext generate /tmp/persona.yaml --api-key x --dry-run > /dev/null
